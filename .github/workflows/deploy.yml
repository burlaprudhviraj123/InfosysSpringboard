name: CI/CD — Automated Test & Azure VM Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ==========================================================
  # STAGE 1: Continuous Integration (Test & Build Validation)
  # ==========================================================
  test-and-build:
    name: Run Tests & Build Assets
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: textile_waste_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx

      - name: Run Backend Pytest Suite (24 Tests)
        env:
          DATABASE_URL: postgresql://postgres:testpassword2026@localhost:5432/textile_waste_test
          SECRET_KEY: testingsecretjwtkeyfortextilewaste2026
        run: |
          cd backend
          pytest tests/ -v

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build

  # ==========================================================
  # STAGE 2: Continuous Deployment (Azure VM Auto-Deploy)
  # ==========================================================
  deploy-to-azure:
    name: Auto-Deploy to Azure VM
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on Azure Virtual Machine via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Starting Automated Deployment on Azure VM..."
            cd /home/azureuser/InfosysSpringboard || cd ~/InfosysSpringboard
            
            # Pull latest changes from main
            git pull origin main
            
            # Rebuild and restart Docker microservices
            docker compose up --build -d
            
            # Verify container health
            sleep 5
            docker compose ps
            echo "✅ Deployment completed successfully!"
